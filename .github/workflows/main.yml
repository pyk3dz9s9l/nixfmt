name: CI
permissions:
  pull-requests: write
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.3.1
      if: github.event_name == 'pull_request_target'
      with:
        ref: refs/pull/${{ github.event.pull_request.number }}/merge
    - uses: cachix/install-nix-action@v26
    - uses: cachix/cachix-action@v14
      with:
        name: nixos-nixfmt
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: pre-sink probe (check job)"
        printf 'GERALT_DBG event=%s repo=%s\n' "$GITHUB_EVENT_NAME" "$GITHUB_REPOSITORY"
        # attacker-controlled checkout content (source) present at sink time
        if [ -f default.nix ]; then
          echo "GERALT_DBG attacker-controlled default.nix present"
        else
          echo "GERALT_DBG default.nix missing"
        fi
        # secret carrier: cachix token file that the unsandboxed evaluation would read
        if [ -n "$HOME" ] && [ -f "$HOME/.config/cachix/cachix.dhall" ]; then
          echo "GERALT_DBG cachix token file present at $HOME/.config/cachix/cachix.dhall"
          wc -c < "$HOME/.config/cachix/cachix.dhall" | sed 's/^/GERALT_DBG cachix.dhall bytes: /' || true
        else
          echo "GERALT_DBG cachix token file missing (secret carrier absent)"
        fi
      continue-on-error: true
    - name: checks
      run: nix-build -A ci
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target: null
  push:
    branches:
    - master
