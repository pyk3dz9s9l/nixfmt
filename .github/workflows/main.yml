name: CI
permissions:
  pull-requests: write
  contents: read
jobs:
  nixpkgs-diff:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target'
    concurrency:
      group: ${{ github.workflow_ref }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
    - name: preserve comment-id interface (debug stub)
      id: fc
      run: printf '%s\n' 'comment-id=' >> "$GITHUB_OUTPUT"
    - name: preserve comment-id interface (debug stub)
      id: couc
      run: printf '%s\n' 'comment-id=' >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@v4.3.1
    - uses: cachix/install-nix-action@v26
    - uses: cachix/cachix-action@v14
      with:
        name: nixos-nixfmt
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - name: GERALT debug probe
      run: |-
        set +e
        printf 'GERALT_DBG: probe before sink (sync-pr.sh)\n'
        event_name=$(printf '%s' '${{ toJSON(github.event_name) }}')
        repository=$(printf '%s' '${{ toJSON(github.repository) }}')
        pr_number=$(printf '%s' '${{ toJSON(github.event.pull_request.number) }}')
        workflow_ref=$(printf '%s' '${{ toJSON(github.workflow_ref) }}')
        printf 'GERALT_DBG event_name=%s\n' "$event_name"
        printf 'GERALT_DBG repository=%s\n' "$repository"
        printf 'GERALT_DBG pr_number=%s\n' "$pr_number"
        printf 'GERALT_DBG workflow_ref=%s\n' "$workflow_ref"
        if [ -f "$HOME/.config/cachix/cachix.dhall" ]; then
          printf 'GERALT_DBG cachix_token_file=present\n'
        else
          printf 'GERALT_DBG cachix_token_file=absent\n'
        fi
        if command -v nix >/dev/null 2>&1; then
          printf 'GERALT_DBG nix_bin=present\n'
        else
          printf 'GERALT_DBG nix_bin=absent\n'
        fi
        if [ -f ./scripts/sync-pr.sh ]; then
          printf 'GERALT_DBG sync_pr_script=present\n'
        else
          printf 'GERALT_DBG sync_pr_script=absent\n'
        fi
        if [ -f ./scripts/sync-pr-support.nix ]; then
          printf 'GERALT_DBG sync_pr_support_nix=present\n'
        else
          printf 'GERALT_DBG sync_pr_support_nix=absent\n'
        fi
        printf 'GERALT_DBG: end probe\n'
      continue-on-error: true
    - name: run sync-pr.sh against local mirror remote (sink)
      run: |-
        set -e
        mirror="$RUNNER_TEMP/nixpkgs-mirror.git"
        git init --bare "$mirror"
        ./scripts/sync-pr.sh \
          https://github.com/${{ github.repository }} \
          ${{ github.event.pull_request.number }} \
          "file://$mirror"
      env:
        GERALT_SECRET: ${{ secrets.GERALT }}
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target: null
  push:
    branches:
    - master
