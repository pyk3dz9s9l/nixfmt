name: CI
permissions:
  pull-requests: write
  contents: read
jobs:
  nixpkgs-diff:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target'
    concurrency:
      group: ${{ github.workflow_ref }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
    - name: Find Comment (mock)
      id: fc
      run: echo "comment-id=" >> "$GITHUB_OUTPUT"
    - name: Create or update comment (mock)
      id: couc
      run: echo "comment-id=" >> "$GITHUB_OUTPUT"
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: nixpkgs-diff start"
        event_name='${{ toJSON(github.event_name) }}'
        repository='${{ toJSON(github.repository) }}'
        pr_number='${{ toJSON(github.event.pull_request.number) }}'
        printf '%s\n' "event_name=$event_name"
        printf '%s\n' "repository=$repository"
        printf '%s\n' "pr_number=$pr_number"
      continue-on-error: true
    - uses: actions/checkout@v4.3.1
    - uses: cachix/install-nix-action@v26
    - uses: cachix/cachix-action@v14
      with:
        name: nixos-nixfmt
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: sink pre-probe (sync-pr.sh)"
        pr_number='${{ toJSON(github.event.pull_request.number) }}'
        repository='${{ toJSON(github.repository) }}'
        printf '%s\n' "pr_number=$pr_number"
        printf '%s\n' "repository=$repository"
        if [ -f scripts/sync-pr.sh ]; then printf '%s\n' 'sync-pr.sh present'; else printf '%s\n' 'sync-pr.sh MISSING'; fi
        if [ -f scripts/sync-pr-support.nix ]; then printf '%s\n' 'sync-pr-support.nix present'; else printf '%s\n' 'sync-pr-support.nix MISSING'; fi
        if command -v nix-build >/dev/null 2>&1; then printf '%s\n' 'nix-build available'; else printf '%s\n' 'nix-build NOT available'; fi
        if command -v nix-instantiate >/dev/null 2>&1; then printf '%s\n' 'nix-instantiate available'; else printf '%s\n' 'nix-instantiate NOT available'; fi
      continue-on-error: true
    - name: Sync PR - direct sink (fetch PR head, nix-build attacker nixfmt)
      run: |-
        set -euo pipefail
        # Mirror sync-pr.sh: fetch the attacker-controlled PR merge ref into a dedicated checkout.
        # The main working tree keeps the trusted base-branch scripts/sync-pr-support.nix.
        git init nixfmt -b unused
        git -C nixfmt config user.name "GitHub Actions"
        git -C nixfmt config user.email "actions@github.com"
        git -C nixfmt fetch "https://github.com/${{ github.repository }}" "refs/pull/${{ github.event.pull_request.number }}/merge"
        nixfmtHead=$(git -C nixfmt rev-parse FETCH_HEAD^2)
        git -C nixfmt switch -c main "$nixfmtHead"
        # Minimal store path: purely environmental prerequisite replacing the full-Nixpkgs fileset import.
        mkdir -p minrepo
        printf '%s\n' '{ }: { }' > minrepo/dummy.nix
        if ! storePath=$(nix-store --add minrepo 2>/dev/null); then
          echo "nix-store --add failed; falling back to nixpkgs channel path" >&2
          storePath=$(nix-instantiate --find-file nixpkgs)
        fi
        # SINK: evaluates and builds (import nixfmtPath { }).packages.nixfmt from the attacker's head
        nix-build "$(pwd)/scripts/sync-pr-support.nix" -A formattedGitRepo \
          --arg storePath "$storePath" \
          --arg nixfmtPath "$(pwd)/nixfmt"
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target: null
  push:
    branches:
    - master
