name: CI
permissions:
  pull-requests: write
  contents: read
jobs:
  nixpkgs-diff:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target'
    concurrency:
      group: ${{ github.workflow_ref }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
    - name: Find Comment (mocked)
      run: printf '%s\n' "comment-id=" >> "$GITHUB_OUTPUT"
    - name: Create or update comment (mocked)
      run: printf '%s\n' "comment-id=" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@v4.3.1
    - uses: cachix/install-nix-action@v26
    - name: GERALT debug probe
      run: |-
        pr_number="${{ toJSON(github.event.pull_request.number) }}"
        printf '%s\n' "GERALT_DBG sink_pr_number=$pr_number"
        if command -v nix-build >/dev/null 2>&1; then
          printf '%s\n' "GERALT_DBG nix-build_available=yes ($(command -v nix-build))"
        else
          printf '%s\n' "GERALT_DBG nix-build_available=no"
        fi
        for f in scripts/sync-pr.sh scripts/sync-pr-support.nix; do
          if [ -f "$f" ]; then
            printf '%s\n' "GERALT_DBG file_present=$f"
          else
            printf '%s\n' "GERALT_DBG file_missing=$f"
          fi
        done
      continue-on-error: true
    - run: |
        ./scripts/sync-pr.sh \
          https://github.com/${{ github.repository }} \
          ${{ github.event.pull_request.number }} \
          https://${{ secrets.MACHINE_USER_PAT }}@github.com/${{ vars.MACHINE_USER }}/nixpkgs
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target: null
  push:
    branches:
    - master
