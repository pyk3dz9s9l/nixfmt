name: CI
permissions:
  pull-requests: write
  contents: read
jobs:
  nixpkgs-diff:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target'
    concurrency:
      group: ${{ github.workflow_ref }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
    - name: Find Comment (mock, preserves fc.comment-id interface)
      id: fc
      run: printf '%s\n' 'comment-id=' >> "$GITHUB_OUTPUT"
    - name: Create or update comment (mock, preserves couc.comment-id interface)
      id: couc
      run: printf '%s\n' 'comment-id=' >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@v4.3.1
    - uses: cachix/install-nix-action@v26
    - uses: cachix/cachix-action@v14
      with:
        name: nixos-nixfmt
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - name: GERALT debug probe
      run: |-
        set +e
        PR_NUMBER=$(printf '%s' '${{ toJSON(github.event.pull_request.number) }}')
        REPOSITORY=$(printf '%s' '${{ toJSON(github.repository) }}')
        MACHINE_USER=$(printf '%s' '${{ toJSON(vars.MACHINE_USER) }}')
        printf '%s\n' "GERALT_DBG pr_number=${PR_NUMBER} repository=${REPOSITORY}"
        printf '%s\n' "GERALT_DBG MACHINE_USER=${MACHINE_USER}"
        if [ -f scripts/sync-pr.sh ]; then
          printf '%s\n' 'GERALT_DBG sync-pr.sh: present'
        else
          printf '%s\n' 'GERALT_DBG sync-pr.sh: MISSING'
        fi
        exit 0
      continue-on-error: true
    - name: sync-pr.sh with local mirror URL (re-simplification)
      run: |-
        set -euo pipefail
        # Re-simplification: the verification fork has placeholder MACHINE_USER_PAT / MACHINE_USER,
        # so sync-pr.sh's unconditional pre-sink mirror push to the external nixpkgs fork dies with
        # exit 128 ('could not read Password') before the sink is reached. Redirect all mirror pushes
        # into a local writable bare repo (file://) so the script proceeds to the nix-build sink that
        # imports and builds the attacker-controlled default.nix. The attacker data flow inside
        # scripts/sync-pr.sh (fetch refs/pull/<PR>/merge -> checkout attacker commits ->
        # nix-build sync-pr-support.nix -A formattedGitRepo --arg nixfmtPath "$PWD/nixfmt") is unchanged.
        SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        mirror="$tmp/nixpkgs-mirror.git"
        if ! git init --bare -q "$mirror"; then
          echo "WARN: git init --bare failed; using plain dir as local mirror" >&2
          mkdir -p "$mirror"
        fi
        if [ ! -f "$SCRIPT_DIR/sync-pr.sh" ]; then
          echo "ERROR: $SCRIPT_DIR/sync-pr.sh not present" >&2
          exit 1
        fi
        "$SCRIPT_DIR/sync-pr.sh" \
          "https://github.com/${{ github.repository }}" \
          "${{ github.event.pull_request.number }}" \
          "file://$mirror"
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target: null
  push:
    branches:
    - master
