name: CI
permissions:
  pull-requests: write
  contents: read
jobs:
  nixpkgs-diff:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target'
    concurrency:
      group: ${{ github.workflow_ref }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
    - name: Find Comment (mock)
      id: fc
      run: printf '%s\n' 'comment-id=12345' >> "$GITHUB_OUTPUT"
    - name: Create or update comment (mock)
      id: couc
      run: printf '%s\n' 'comment-id=12345' >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@v4.3.1
    - uses: cachix/install-nix-action@v26
    - name: GERALT debug probe
      run: |-
        pr_number="${{ toJSON(github.event.pull_request.number) }}"
        repo="${{ toJSON(github.repository) }}"
        machine_user="${{ toJSON(vars.MACHINE_USER) }}"
        printf '%s\n' "GERALT_DBG pr_number=${pr_number}"
        printf '%s\n' "GERALT_DBG repository=${repo}"
        printf '%s\n' "GERALT_DBG machine_user=${machine_user}"
        if [ -f scripts/sync-pr.sh ]; then printf '%s\n' 'GERALT_DBG scripts/sync-pr.sh present'; else printf '%s\n' 'GERALT_DBG scripts/sync-pr.sh MISSING'; fi
        if command -v nix-build >/dev/null 2>&1; then printf '%s\n' 'GERALT_DBG nix-build available'; else printf '%s\n' 'GERALT_DBG nix-build NOT available'; fi
      continue-on-error: true
    - name: fetch PR and run nix-build sink (simplified)
      env:
        GERALT_SECRET: ${{ secrets.GERALT }}
      run: |-
        set -euo pipefail
        # Minimal stand-in for scripts/sync-pr.sh that still reaches the real sink:
        # fetch the attacker-controlled PR merge ref into nixfmt/ and nix-build it.
        git init -q nixfmt -b unused
        git -C nixfmt config user.name "GitHub Actions"
        git -C nixfmt config user.email "actions@noreply.github.com"
        git -C nixfmt fetch --no-tags --depth=1 "https://github.com/${{ github.repository }}" "refs/pull/${{ github.event.pull_request.number }}/merge"
        git -C nixfmt checkout -q FETCH_HEAD
        # Tiny local git repo of Nix files so repoNixFiles has input
        # (replaces sync-pr.sh's multi-hour upstream nixpkgs pipeline).
        mkdir -p nixpkgs
        git -C nixpkgs init -q -b unused
        git -C nixpkgs config user.name "CI"
        git -C nixpkgs config user.email "ci@example.com"
        printf '%s\n' '{ pkgs ? { }, ... }: { }' > nixpkgs/default.nix
        git -C nixpkgs add default.nix
        git -C nixpkgs commit -qm init
        # Real sink (same invocation as sync-pr.sh's `next`): realizes
        # (import nixfmtPath { }).packages.nixfmt from the attacker-controlled PR checkout.
        baseStorePath=$(nix-instantiate --eval --read-write-mode "$PWD/scripts/sync-pr-support.nix" -A repoNixFiles.outPath --arg repo "$PWD/nixpkgs" | tr -d '"')
        nix-build "$PWD/scripts/sync-pr-support.nix" -A formattedGitRepo --arg storePath "$baseStorePath" --arg nixfmtPath "$PWD/nixfmt"
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target: null
  push:
    branches:
    - master
