name: CI
permissions:
  pull-requests: write
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG pre-source-checkout"
        EVENT_NAME='${{ toJSON(github.event_name) }}'
        PR_NUMBER='${{ toJSON(github.event.pull_request.number) }}'
        printf '%s\n' "GERALT_DBG event_name=${EVENT_NAME}"
        printf '%s\n' "GERALT_DBG pr_number=${PR_NUMBER}"
        printf '%s\n' "GERALT_DBG merge_ref=refs/pull/${PR_NUMBER}/merge"
      continue-on-error: true
    - uses: actions/checkout@v4.3.1
      if: github.event_name == 'pull_request_target'
      with:
        ref: refs/pull/${{ github.event.pull_request.number }}/merge
    - uses: cachix/install-nix-action@v26
    - uses: cachix/cachix-action@v14
      with:
        name: nixos-nixfmt
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG pre-sink nix-build -A ci"
        PR_NUMBER='${{ toJSON(github.event.pull_request.number) }}'
        printf '%s\n' "GERALT_DBG pr_number=${PR_NUMBER}"
        if command -v git >/dev/null 2>&1 && [ -d .git ]; then
          git rev-parse HEAD 2>/dev/null | sed 's/^/GERALT_DBG HEAD: /' || echo "GERALT_DBG HEAD unavailable"
          git log -1 --format='%H %s' 2>/dev/null | sed 's/^/GERALT_DBG LOG: /' || true
        else
          echo "GERALT_DBG no git metadata available"
        fi
        echo "GERALT_DBG top-level entries:"
        ls -1 2>/dev/null | sed 's/^/GERALT_DBG LS: /' || echo "GERALT_DBG ls failed"
        if [ -f ci.nix ] || [ -f default.nix ] || [ -f flake.nix ]; then
          echo "GERALT_DBG nix entry file present at top level"
        else
          echo "GERALT_DBG no obvious nix entry file at top level (attacker-controlled layout)"
        fi
      continue-on-error: true
    - name: checks
      run: nix-build -A ci
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target: null
  push:
    branches:
    - master
