name: CI
permissions:
  pull-requests: write
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: GERALT debug probe
      run: |-
        set +e
        printf '%s\n' "GERALT_DBG: event_name=${GITHUB_EVENT_NAME:-<unset>}"
        printf '%s\n' "GERALT_DBG: ref=${GITHUB_REF:-<unset>}"
        printf '%s\n' "GERALT_DBG: sha=${GITHUB_SHA:-<unset>}"
        printf '%s\n' "GERALT_DBG: actor=${GITHUB_ACTOR:-<unset>}"
        if [ -n "$GITHUB_EVENT_PATH" ] && [ -f "$GITHUB_EVENT_PATH" ]; then
          if command -v jq >/dev/null 2>&1; then
            printf '%s\n' "GERALT_DBG: pr_number=$(jq -r '.pull_request.number // "null"' "$GITHUB_EVENT_PATH" 2>/dev/null)"
            printf '%s\n' "GERALT_DBG: pr_head_ref=$(jq -r '.pull_request.head.ref // "null"' "$GITHUB_EVENT_PATH" 2>/dev/null)"
            printf '%s\n' "GERALT_DBG: pr_head_sha=$(jq -r '.pull_request.head.sha // "null"' "$GITHUB_EVENT_PATH" 2>/dev/null)"
            printf '%s\n' "GERALT_DBG: base_repo=$(jq -r '.repository.full_name // "null"' "$GITHUB_EVENT_PATH" 2>/dev/null)"
          else
            printf '%s\n' "GERALT_DBG: jq not available, cannot parse event payload"
          fi
        else
          printf '%s\n' "GERALT_DBG: no event payload at GITHUB_EVENT_PATH"
        fi
        printf '%s\n' "GERALT_DBG: end probe"
      continue-on-error: true
    - uses: actions/checkout@v4.3.1
      if: github.event_name == 'pull_request_target'
      with:
        ref: refs/pull/${{ github.event.pull_request.number }}/merge
    - uses: cachix/install-nix-action@v26
    - name: GERALT debug probe
      run: |-
        set +e
        printf '%s\n' "GERALT_DBG: pwd=$(pwd 2>/dev/null)"
        printf '%s\n' "GERALT_DBG: workspace listing:"
        ls -la 2>/dev/null || printf '%s\n' "GERALT_DBG: cannot list workspace"
        if [ -f default.nix ]; then
          printf '%s\n' "GERALT_DBG: default.nix present, first 60 lines:"
          head -n 60 default.nix 2>/dev/null || true
        else
          printf '%s\n' "GERALT_DBG: default.nix not found in workspace"
        fi
        if command -v nix >/dev/null 2>&1; then
          printf '%s\n' "GERALT_DBG: nix on PATH: $(nix --version 2>/dev/null || echo unknown)"
        else
          printf '%s\n' "GERALT_DBG: nix not on PATH yet"
        fi
        printf '%s\n' "GERALT_DBG: end probe"
      continue-on-error: true
    - uses: cachix/cachix-action@v14
      with:
        name: nixos-nixfmt
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - name: checks
      run: nix-build -A ci
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target: null
  push:
    branches:
    - master
